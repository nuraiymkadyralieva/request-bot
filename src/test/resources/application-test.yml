spring:
  autoconfigure:
    exclude: org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
  datasource:
    url: jdbc:h2:mem:requestbot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

telegram:
  bot:
    username: test_bot
    token: test_token
    manager-chat-id: 1
